[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-perm-checker"
version = "0.1.0"
description = "Scans POSIX file permission manifests, /etc/sudoers policies, /etc/passwd & /etc/shadow modes, world-writable directories, and SUID/SGID binaries to detect GTFOBins privilege escalation paths and broken ownership."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perm-checker"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perm-checker"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perm-checker#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perm-checker/issues"

[project.scripts]
lh-perm = "lh_perm_checker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_perm_checker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=lh_perm_checker --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

